name: Build Lumina APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: 26.1.10909125

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest'

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --install \
            "ndk;$NDK_VERSION" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-34"

      - name: Create google-services.json
        run: |
          cat > app/google-services.json << 'EOF'
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: Set NDK env
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "NDK=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> $GITHUB_ENV

      - name: Install OpenSSL build deps
        run: sudo apt-get install -y perl make

      - name: Build OpenSSL for Android
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          git clone --depth 1 --branch openssl-3.0.15 https://github.com/openssl/openssl.git openssl-src
          cd openssl-src
          export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          perl Configure android-arm64 -D__ANDROID_API__=21 --prefix=$GITHUB_WORKSPACE/openssl-output
          make -j4
          make install_sw

      - name: Build APK
        env:
          OPENSSL_ROOT_DIR: ${{ github.workspace }}/openssl-output
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuminaClient-APK
          path: app/build/outputs/apk/release/*.apk
