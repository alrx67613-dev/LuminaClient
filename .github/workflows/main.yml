name: Build Lumina APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK and CMake
        run: |
          yes | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-34"

      - name: Build OpenSSL
        env:
          NDK: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: bash build-openssl.sh

      - name: Build APK
        env:
          NDK: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuminaClient-APK
          path: app/build/outputs/apk/release/*.apk
